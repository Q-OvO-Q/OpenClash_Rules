# NAME: Finance_Shared —— 英美共用（走「🏦 英美共用」，默认英国；用美国账户时把这个组手动切到美国，用完切回）
# 放在仓库根目录；OpenClash_Rules.ini 会引用：
#   https://raw.githubusercontent.com/Q-OvO-Q/OpenClash_Rules/refs/heads/main/Finance_Shared.yaml
#
# 收录标准只有两条：
#   1. 同一个域名既管英国账户也管美国账户，分不开（运通、Chase、汇丰全球站）
#   2. 不属于某一家银行、而是跟着银行一起被调用的公共设施：卡组织、网上付款验证页、风控 / 身份验证厂商
#      （银行看到你在美国、风控厂商却看到你在英国，本身就是风险信号，所以它们要跟着你当前在用的那家走）
# Visa / 万事达的域名很多，没有写在这里，在 ini 里用上游列表（geosite:visa / mastercard）指到同一个组。
# PayPal 也是英美共用，但模板里它本来就有自己的「💳 PayPal」组，可以单独切换，所以不在这里。
#
# 还有别的机构你两边都有账户：把它那几行从 Finance_UK.yaml 剪过来即可（例如 Wise、Revolut、Klarna、Stripe，现在都在英国那份里）。
payload:
  # ---- 1. 同一个域名管两国账户 ----
  # American Express：英国和美国账户都在 americanexpress.com 登录
  - DOMAIN-KEYWORD,americanexpress
  - DOMAIN-SUFFIX,aexp-static.com
  # Chase：chase.com 是美国 Chase 的域名，英国 Chase 的 App 后台也可能挂在它下面（英国官网 chase.co.uk 在 Finance_UK.yaml）
  - DOMAIN-SUFFIX,chase.com
  - DOMAIN-SUFFIX,chasecdn.com
  # 汇丰全球站 hsbc.com（英国站 hsbc.co.uk / hsbc.uk 在 Finance_UK.yaml；美国站 us.hsbc.com 在 Finance_US.yaml，排在这份前面先被接走）
  - DOMAIN-SUFFIX,hsbc.com
  # Experian / Credit Karma 的 .com 主站：美国用户用的是它，英国 App 也可能调用它（英国站 .co.uk 在 Finance_UK.yaml）
  - DOMAIN-SUFFIX,experian.com
  - DOMAIN-SUFFIX,creditkarma.com
  - DOMAIN-SUFFIX,creditkarmacdn.com
  - DOMAIN-SUFFIX,ckapis.com

  # ---- 2. 公共设施 ----
  # 网上付款时弹出的银行验证页（3-D Secure）
  - DOMAIN-SUFFIX,cardinalcommerce.com
  - DOMAIN-SUFFIX,arcot.com
  # 「连接你的银行账户」（英美都用 Plaid；只做英国 / 欧洲的 TrueLayer 等在 Finance_UK.yaml）
  - DOMAIN-SUFFIX,plaid.com
  # 风控 / 身份验证厂商
  - DOMAIN-SUFFIX,forter.com
  - DOMAIN-SUFFIX,siftscience.com
  - DOMAIN-SUFFIX,sift.com
  - DOMAIN-SUFFIX,online-metrix.net
  - DOMAIN-SUFFIX,threatmetrix.com
  - DOMAIN-SUFFIX,iovation.com
  - DOMAIN-SUFFIX,iesnare.com
  - DOMAIN-SUFFIX,sardine.ai
  - DOMAIN-SUFFIX,accertify.com
  - DOMAIN-SUFFIX,inauth.com
  - DOMAIN-SUFFIX,kount.com
  - DOMAIN-SUFFIX,riskified.com
  - DOMAIN-SUFFIX,signifyd.com
  - DOMAIN-SUFFIX,nudatasecurity.com
  - DOMAIN-SUFFIX,biocatch.com
  - DOMAIN-SUFFIX,seon.io
  - DOMAIN-SUFFIX,onfido.com
  - DOMAIN-SUFFIX,jumio.com
  - DOMAIN-SUFFIX,netverify.com
  - DOMAIN-SUFFIX,veriff.com
  - DOMAIN-SUFFIX,veriff.me
  - DOMAIN-SUFFIX,sumsub.com
  - DOMAIN-SUFFIX,withpersona.com
  - DOMAIN-SUFFIX,trulioo.com
