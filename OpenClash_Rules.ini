;Talkatone 补充：登录信令（TCP 5222）和通话是直接连 IP 的，不补这几段就会掉到「🔀 非标端口」直连
ruleset=📞 Talkatone,[]IP-CIDR,69.46.75.0/24,no-resolve
ruleset=📞 Talkatone,[]IP-CIDR,205.164.56.0/24,no-resolve
ruleset=📞 Talkatone,[]IP-CIDR,50.117.27.0/24,no-resolve
ruleset=📞 Talkatone,[]IP-CIDR,72.18.158.0/24,no-resolve
ruleset=📞 Talkatone,[]IP-CIDR,63.251.124.0/24,no-resolve
ruleset=📞 Talkatone,[]IP-CIDR,216.172.154.0/24,no-resolve
;Talkatone 启动时查出口 IP 的请求和内嵌广告组件，和主连接走同一个出口
ruleset=📞 Talkatone,[]DOMAIN,checkip.amazonaws.com
ruleset=📞 Talkatone,[]DOMAIN-SUFFIX,inner-active.mobi
;Wi-Fi 通话：手机和运营商网关之间的 IKEv2 隧道（UDP 500 / 4500）。在这里单独认领，后面 NordVPN 的 500 / 4500 端口规则就碰不到它
;域名是标准格式 epdg.epc.mncXXX.mccYYY.pub.3gppnetwork.org；两个网段是日志里手机直接连过的 StarHub 网关地址
ruleset=📶 Wi-Fi 通话,[]DOMAIN-SUFFIX,pub.3gppnetwork.org
ruleset=📶 Wi-Fi 通话,[]IP-CIDR,122.11.213.0/24,no-resolve
ruleset=📶 Wi-Fi 通话,[]IP-CIDR,203.116.25.0/24,no-resolve
;NordVPN 的官网 / 账户 / App 接口。隧道本身连的是服务器 IP，那部分端口规则在本文件靠后、「🔀 非标端口」前面
ruleset=🔐 NordVPN,[]GEOSITE,nordvpn
ruleset=🔐 NordVPN,[]DOMAIN-SUFFIX,nordaccount.com
ruleset=🔐 NordVPN,[]DOMAIN-KEYWORD,napps-
