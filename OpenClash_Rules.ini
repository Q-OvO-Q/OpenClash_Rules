[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则
;修改顺序会影响分流效果

;本地地址和域名直连
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
;===== 金融 / 支付 / 加密货币（2026-11）=====
;按 IP 做风控的服务放最前面，后面任何名单都抢不走。顺序：中国大陆直连 → 只做美国业务 → 英美共用 → PayPal → 加密货币 → 其余走英国
;1. 中国大陆：国内银行 / 证券 / 银联，以及外资机构的中国站（汇丰中国、PayPal / Visa / 万事达中国站）。必须排在下面几步前面
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,americanexpress.com.cn
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,americanexpress.cn
ruleset=🎯 全球直连,[]GEOSITE,category-bank-cn
ruleset=🎯 全球直连,[]GEOSITE,category-securities-cn
ruleset=🎯 全球直连,[]GEOSITE,category-finance@cn
ruleset=🎯 全球直连,[]GEOSITE,category-cryptocurrency@cn
ruleset=🎯 全球直连,[]GEOSITE,paypal@cn
ruleset=🎯 全球直连,[]GEOSITE,visa@cn
ruleset=🎯 全球直连,[]GEOSITE,mastercard@cn
;2. 只做美国业务的机构
ruleset=🏦 美国金融,clash-classic:https://raw.githubusercontent.com/Q-OvO-Q/OpenClash_Rules/refs/heads/main/Finance_US.yaml,86400
;3. 英美共用同一个域名的机构，以及跟着银行一起被调用的卡组织 / 付款验证 / 风控厂商。用哪国的账户，就把这个组切到哪国
ruleset=🏦 英美共用,clash-classic:https://raw.githubusercontent.com/Q-OvO-Q/OpenClash_Rules/refs/heads/main/Finance_Shared.yaml,86400
ruleset=🏦 英美共用,[]GEOSITE,visa
ruleset=🏦 英美共用,[]GEOSITE,mastercard
;4. PayPal、加密货币：模板原有的两个组，规则从后面挪到这里
ruleset=💳 PayPal,[]GEOSITE,paypal
ruleset=🪙 加密货币,clash-classic:https://raw.githubusercontent.com/Q-OvO-Q/OpenClash_Rules/refs/heads/main/Crypto.yaml,86400
ruleset=🪙 加密货币,[]GEOSITE,category-cryptocurrency
;5. 其余：英国 / 欧洲机构，以及上游 category-finance（汇丰其他地区站、渣打、盈透、富途、老虎、长桥、N26、Wise、Stripe 等）
ruleset=🏦 英国金融,clash-classic:https://raw.githubusercontent.com/Q-OvO-Q/OpenClash_Rules/refs/heads/main/Finance_UK.yaml,86400
ruleset=🏦 英国金融,[]GEOSITE,category-finance
;本项目收录的直连规则
ruleset=🎯 全球直连,clash-classic:https://raw.githubusercontent.com/Q-OvO-Q/OpenClash_Rules/refs/heads/main/My_Direct.yaml,86400
ruleset=🎯 全球直连,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs,1800
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800
;本项目收录的代理规则
ruleset=🚀 手动选择,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.mrs,28800
ruleset=🚀 手动选择,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800
;国内游戏域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
;Steam 下载 CDN 直连
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Classical.yaml,28800
