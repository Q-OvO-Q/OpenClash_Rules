[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则
;修改顺序会影响分流效果

;本地地址和域名直连
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
;本项目收录的直连规则
ruleset=🎯 全球直连,clash-classic:https://raw.githubusercontent.com/Q-OvO-Q/OpenClash_Rules/refs/heads/main/My_Direct.yaml,86400
ruleset=🎯 全球直连,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs,1800
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800
;本项目收录的代理规则
ruleset=🚀 手动选择,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.mrs,28800
ruleset=🚀 手动选择,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800
;国内游戏域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
;Steam 下载 CDN 直连
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Classical.yaml,28800
;各大游戏平台下载域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download
;BT Tracker 相关域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker
;Zoom 视频会议优先走代理，可在独立策略组切换直连
ruleset=📹 Zoom,[]GEOSITE,zoom
ruleset=📞 Talkatone,[]GEOSITE,talkatone
ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=🎧 Discord,[]GEOSITE,discord
;其余即时通讯域名由通用分组处理，专用规则须位于此分类之前
ruleset=💬 即时通讯,[]GEOSITE,category-communication
ruleset=🤖 Grok,[]GEOSITE,xai
;社交媒体包括了 Twitter(X)/Facebook/Instagram 等海外主流社交媒体
ruleset=🌐 社交媒体,[]GEOSITE,category-social-media-!cn
ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=💾 OneDrive,[]GEOSITE,onedrive
ruleset=🤖 Copilot,[]GEOSITE,bing
ruleset=🤖 Claude,[]GEOSITE,anthropic
ruleset=🤖 Gemini,[]GEOSITE,google-gemini
ruleset=🤖 国外AI服务,[]GEOSITE,category-ai-!cn
;国内 AI 服务默认直连，可按需切换代理；须位于 cn 兜底规则之前
ruleset=🤖 国内AI服务,[]GEOSITE,category-ai-cn
ruleset=📦 容器服务,[]GEOSITE,docker
ruleset=📦 容器服务,[]GEOSITE,category-container
ruleset=🚀 GitHub,[]GEOSITE,github
;其余开发者服务包括 GitLab、软件仓库和开发工具等相关域名
ruleset=💻 开发者服务,[]GEOSITE,category-dev
;学术资源包括 Google Scholar、IEEE、ACM 和主要学术出版平台等相关域名
