ruleset=🚀 GitHub,[]GEOSITE,github
;下一条 category-dev 整个包含了 apple-dev（CloudKit、MapKit、developer.apple.com、Xcode 下载与签名时间戳、Swift/WebKit 等苹果自家开发域名），
;不拦的话这些苹果域名全会走开发者服务组（默认香港）。它们国内直连都能完整使用，所以在这里先交给苹果服务
ruleset=🍎 苹果服务,[]GEOSITE,apple-dev
;其余开发者服务包括 GitLab、软件仓库和开发工具等相关域名
ruleset=💻 开发者服务,[]GEOSITE,category-dev
;学术资源包括 Google Scholar、IEEE、ACM 和主要学术出版平台等相关域名
ruleset=📚 学术资源,[]GEOSITE,category-scholar-!cn
;测速工具包括 SpeedTest 等主流测速工具域名
ruleset=🚀 测速工具,[]GEOSITE,category-speedtest
ruleset=🎮 Steam,[]GEOSITE,steam
ruleset=📹 YouTube,[]GEOSITE,youtube
ruleset=🎥 AppleTV+,[]GEOSITE,apple-tvplus
;===== 苹果服务（2026-11 重排）=====
;排序原则：越「挑出口」的越靠前 —— 要外区出口的（Apple 智能 / 专用代理 / 海外专属）> 只能国内直连的 > 有国内 CDN 的 > 其余苹果域名和 IP
;Siri AI、Apple 智能、iCloud 专用代理的核心规则写在 OpenClash「自定义规则」（Custom_Rules.yaml），那里优先级最高，不会被任何列表抢走
;下面 1～2 组是上游维护的同类列表，作用是自动补上上游以后新增的域名
;1. Apple 智能 / Siri AI（私有云计算中继、扩展中继、地区判定）
ruleset=🍎 Apple Intelligence,[]GEOSITE,apple-intelligence
ruleset=🍎 Apple Intelligence,https://ruleset.skk.moe/Clash/non_ip/apple_intelligence.txt,86400
;2. iCloud 专用代理（Sukka 2026 版带 canary 探测域名；blackmatrix7 那份停在 2024-01，已由自定义规则覆盖）
ruleset=🍎 iCloud Private Relay,clash-domain:https://ruleset.skk.moe/Clash/domainset/icloud_private_relay.txt,86400
ruleset=🍎 iCloud Private Relay,[]GEOSITE,icloudprivaterelay
;3. 必须走代理的：被墙，或苹果按中国大陆 IP 限制内容（Apple News、播客浏览/搜索、图书商店、App Store 网页版）。只是国内没节点但直连能用的不放这里
;   必须排在第 5 条国内 CDN 列表前面，因为那份列表里有 +.itunes.apple.com，会把 books.itunes.apple.com 一起拉成直连
ruleset=🍎 Apple Global,clash-classic:https://raw.githubusercontent.com/Q-OvO-Q/OpenClash_Rules/refs/heads/main/Apple_Global.yaml,86400
;3b. iCloud 大文件：照片/视频原件、云盘文件、备份数据块都走 icloud-content.com。单独一个组，默认走代理；想省流量就把组切到「🎯 全球直连」
;   登录、同步指令等小请求不在这里，照旧直连。icloud-content.com.cn（云上贵州）是另一个域名，不受影响
ruleset=🍎 iCloud 数据,[]DOMAIN-SUFFIX,icloud-content.com
;4. 中国大陆专属：iCloud（云上贵州）、中国版地图等，只能直连
ruleset=🎯 全球直连,https://ruleset.skk.moe/Clash/non_ip/apple_cn.txt,86400
;5. 有国内 CDN 的下载/更新/商店资源，直连最快；固定走全球直连，这样把「🍎 苹果服务」切到节点时，系统更新和 App 下载也不会跟着走代理
;   注意：Sukka 已把旧的 non_ip/apple_cdn.txt 清空并合并进这个 domainset，旧地址现在是空文件
ruleset=🎯 全球直连,clash-domain:https://ruleset.skk.moe/Clash/domainset/apple_cdn.txt,86400
;6. 其余所有苹果域名
;   去掉了 blackmatrix7 的 Apple 列表：它带了 DOMAIN-SUFFIX,akadns.net（整个 Akamai，含微软等别家）、digicert.com（所有设备的证书吊销检查）、crashlytics.com（谷歌），会误抢别家流量；
;   它独有、其余列表没有的只剩 CDN 别名（*.edgekey.net 之类，设备不会直接连），不影响覆盖
ruleset=🍎 苹果服务,https://ruleset.skk.moe/Clash/non_ip/apple_services.txt,86400
ruleset=🍎 苹果服务,[]GEOSITE,apple
;   上面列表都没收的：Apple Business（vertexsmb.com，官方清单）、MapKit 备用 CDN（cdn-apple-mapkit.com）、苹果在 Akamai/网宿上的 CDN 别名
ruleset=🍎 苹果服务,[]DOMAIN-SUFFIX,vertexsmb.com
ruleset=🍎 苹果服务,[]DOMAIN-SUFFIX,cdn-apple-mapkit.com
ruleset=🍎 苹果服务,[]DOMAIN-SUFFIX,apple.com.edgekey.net
ruleset=🍎 苹果服务,[]DOMAIN-SUFFIX,apple.com.edgesuite.net
ruleset=🍎 苹果服务,[]DOMAIN-SUFFIX,itunes.com.edgekey.net
ruleset=🍎 苹果服务,[]DOMAIN,e16991.b.akamaiedge.net
ruleset=🍎 苹果服务,[]DOMAIN-SUFFIX,apple.com.mwcname.com
;   DigiCert（苹果和几乎所有网站的证书吊销检查都用它），国内直连可用；固定直连，不跟苹果组切换
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,digicert.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,digicert.cn
;7. 苹果 IP 段（App 直接用 IP 连、没有域名时靠它）：IPv4 用 Sukka 列表（含 17.0.0.0/8），IPv6 是 Apple 官方企业网络文档给的三段
ruleset=🍎 苹果服务,https://ruleset.skk.moe/Clash/ip/apple_services.txt,86400
ruleset=🍎 苹果服务,[]IP-CIDR6,2403:300::/32,no-resolve
ruleset=🍎 苹果服务,[]IP-CIDR6,2620:149::/32,no-resolve
ruleset=🍎 苹果服务,[]IP-CIDR6,2a01:b740::/32,no-resolve
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=📢 谷歌FCM,[]GEOSITE,googlefcm
ruleset=🇬 谷歌服务,[]GEOSITE,google
