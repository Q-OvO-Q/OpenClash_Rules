# NAME: Crypto —— 加密货币补充名单（走模板原有的「🪙 加密货币」组，默认英国）
# 放在仓库根目录；OpenClash_Rules.ini 会引用：
#   https://raw.githubusercontent.com/Q-OvO-Q/OpenClash_Rules/refs/heads/main/Crypto.yaml
#
# 只写上游 geosite:category-cryptocurrency 没收的（Kraken、Coinbase、mexc.com、币安、OKX 等上游已有，ini 里紧跟着这份引用了它）。
# 又被识别成别的地区时：用完 App 后看 match_domains.txt，把那个时间点冒出来的陌生域名加进来。
payload:
  # Kraken 母公司 Payward、Kraken 期货站
  - DOMAIN-SUFFIX,payward.com
  - DOMAIN-SUFFIX,cryptofacilities.com
  # 其他交易所 / 钱包
  - DOMAIN-SUFFIX,uphold.com
  - DOMAIN-SUFFIX,bitpanda.com
  - DOMAIN-SUFFIX,ledger.com
  - DOMAIN-SUFFIX,luno.com
  - DOMAIN-SUFFIX,wirexapp.com
  # MEXC 官网（mexc.com / mexc.co 上游已有）
  - DOMAIN-SUFFIX,mexc.fm
  # MEXC App 在国内不用 mexc.com，用的是下面这些替身域名。接口（www / futures / otc / wbs）
  - DOMAIN-SUFFIX,greentreeone.com
  # 配置和静态资源
  - DOMAIN-SUFFIX,mocortech.com
  # 监控上报
  - DOMAIN-SUFFIX,gotoda.co
  # 风控
  - DOMAIN-SUFFIX,moss-risk.com
  # 身份验证
  - DOMAIN-SUFFIX,very.org
  # 验证码
  - DOMAIN-SUFFIX,turingfraud.net
  # 日志上报（阿里云新加坡）
  - DOMAIN-KEYWORD,molor-app
  # App 资源更新
  - DOMAIN,s3-app-release.s3.ap-northeast-1.amazonaws.com
  # MEXC 启动时逐个试探的备用域名
  - DOMAIN-SUFFIX,flytogarden.com
  - DOMAIN-SUFFIX,hotbookzone.com
  - DOMAIN-SUFFIX,dgshen.com
  - DOMAIN-SUFFIX,coldbookfly.ru
  # Kraken 的客服页面、Coinbase 的设备识别
  - DOMAIN,kraken.zendesk.com
  - DOMAIN-SUFFIX,cb-device-intelligence.com
