# NAME: Finance_UK —— 中国大陆以外的银行 / 券商 / 金融科技 / 支付 / 征信（走「🏦 英国金融」）
# 放在仓库根目录；OpenClash_Rules.ini 会引用：
#   https://raw.githubusercontent.com/Q-OvO-Q/OpenClash_Rules/refs/heads/main/Finance_UK.yaml
#
# 这份是「默认去处」：非中国大陆的金融服务，只要不在 Finance_US.yaml（只做美国）、Finance_Shared.yaml（英美共用）、
# Crypto.yaml（加密货币）里，都从英国出口走。ini 里紧跟着这份还接了上游的 geosite:category-finance（盈透、渣打、富途、老虎、长桥等）。
#
# 以后要加新的：在 clash_connlog 导出的 by_domain.csv 里搜 App 名 / 机构名，看它实际连了哪些域名，
# 把「主域名」那一列的值按 DOMAIN-SUFFIX 加进来即可（子域名会自动包含）。
payload:
  # ================= 你点名的（American Express 在 Finance_Shared.yaml；Kraken / Coinbase / Uphold / MEXC 在 Crypto.yaml）=================
  # Revolut
  - DOMAIN-SUFFIX,revolut.com
  - DOMAIN-SUFFIX,revolut.me
  # Monzo
  - DOMAIN-SUFFIX,monzo.com
  - DOMAIN-SUFFIX,monzo.me
  # Chase UK（chase.com 在 Finance_Shared.yaml）
  - DOMAIN-SUFFIX,chase.co.uk
  - DOMAIN-SUFFIX,nutmeg.com
  # HSBC UK / first direct（全球站 hsbc.com 在 Finance_Shared.yaml，美国站在 Finance_US.yaml，中国站在 ini 里先放行直连）
  - DOMAIN-SUFFIX,hsbc.co.uk
  - DOMAIN-SUFFIX,hsbc.uk
  - DOMAIN-SUFFIX,firstdirect.com
  # Barclays / Barclaycard（美国分部 barclaysus.com 在 Finance_US.yaml）
  - DOMAIN-SUFFIX,barclays.co.uk
  - DOMAIN-SUFFIX,barclays.com
  - DOMAIN-SUFFIX,barclaycard.co.uk
  - DOMAIN-SUFFIX,barclaycard.com
  # Experian（.com 主站在 Finance_Shared.yaml）
  - DOMAIN-SUFFIX,experian.co.uk
  - DOMAIN-SUFFIX,experianidentityservice.co.uk
  - DOMAIN-SUFFIX,creditexpert.co.uk
  - DOMAIN-SUFFIX,expcdn.co.uk
  # Credit Karma（.com 主站在 Finance_Shared.yaml）
  - DOMAIN-SUFFIX,creditkarma.co.uk
  # ClearScore
  - DOMAIN-SUFFIX,clearscore.com
  # Curve / Curve Pay
  - DOMAIN-SUFFIX,curve.com
  - DOMAIN-SUFFIX,curve.app
  - DOMAIN-SUFFIX,imaginecurve.com
  # Jaja（jaja.finance 是你日志里 App 实际连的后台）
  - DOMAIN-SUFFIX,jaja.co.uk
  - DOMAIN-SUFFIX,jaja.finance
  # Yonder
  - DOMAIN-SUFFIX,yonder.com
  - DOMAIN-SUFFIX,yondercard.com
  # Zilch
  - DOMAIN-SUFFIX,zilch.com
  - DOMAIN-SUFFIX,payzilch.com
  # Trading 212（用关键词：除 trading212.com 外，日志里它还连 trading212equities.s3.eu-central-1.amazonaws.com）
  - DOMAIN-KEYWORD,trading212
  # SumUp
  - DOMAIN-SUFFIX,sumup.com
  - DOMAIN-SUFFIX,sumup.co.uk
  # bunq
  - DOMAIN-SUFFIX,bunq.com
  - DOMAIN-SUFFIX,bunq.me
  # N26
  - DOMAIN-SUFFIX,n26.com
  - DOMAIN-SUFFIX,number26.de
  - DOMAIN-SUFFIX,tech26.de
  # Plutus
  - DOMAIN-SUFFIX,plutus.it

